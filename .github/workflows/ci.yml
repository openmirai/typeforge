name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: codebuild-fe-mirai-arm-builder-sm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

  check:
    name: Check repository
    runs-on: codebuild-fe-mirai-arm-builder-sm-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [setup]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run verification gate
        run: pnpm verify
