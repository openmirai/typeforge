name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref containing the package version (use a tag for normal releases)
        required: true
        default: main
        type: string
      release_version:
        description: Exact package version to publish, for example 0.1.1
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    # npm Trusted Publishing OIDC only supports GitHub-hosted runners.
    # Keep CodeBuild for CI; publish must run on ubuntu-latest.
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY: https://registry.npmjs.org
      RELEASE_REF: ${{ inputs.release_ref || github.ref }}
      RELEASE_VERSION_INPUT: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm Trusted Publishing runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              throw new Error(`npm ${process.argv[1]} is too old for Trusted Publishing; require npm >= 11.5.1`);
            }
          ' "$npm_version"

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Validate package version matches release tag
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="${RELEASE_REF#refs/tags/}"
            version="${version#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be semver, received: $version" >&2
            exit 1
          fi
          manifest_version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "Release version $version does not match package version $manifest_version" >&2
            exit 1
          fi
          if [[ "$RELEASE_REF" == refs/tags/* || "$RELEASE_REF" == v* ]]; then
            tag_version="${RELEASE_REF#refs/tags/}"
            tag_version="${tag_version#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release ref $RELEASE_REF does not match release version $version" >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish package
        run: |
          set -euo pipefail
          if npm view "@openmirai/typeforge@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "@openmirai/typeforge@${RELEASE_VERSION} is already published"
          else
            npm publish --access public
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${RELEASE_VERSION} already exists"
            exit 0
          fi
          release_args=(
            "v${RELEASE_VERSION}"
            --title "v${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "$RELEASE_REF" == refs/tags/* || "$RELEASE_REF" == v* ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$RELEASE_REF")
          fi
          gh release create "${release_args[@]}"
